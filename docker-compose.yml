services:
  bot:
    build: .
    image: shedule_bot:latest
    volumes:
      - .:/app        # code — edit without rebuild
      - ./data:/data  # IT-managed files (schedule.xlsx, db, logs) — edit without rebuild
      - /etc/localtime:/etc/localtime:ro
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ}  # read from .env via compose interpolation
    dns:
      - 8.8.8.8
      - 8.8.4.4

  cron:
    image: shedule_bot:latest
    volumes:
      - .:/app        # code — same as bot service
      - ./data:/data  # IT-managed files shared with bot
      - /etc/localtime:/etc/localtime:ro
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ}  # read from .env via compose interpolation
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: sh -c "python /app/gen_crontab.py && supercronic /app/crontab.generated"
    restart: unless-stopped
